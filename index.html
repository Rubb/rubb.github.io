<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* GitHub Dark Background */
            color: #c9d1d9; /* Off-white text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 540px;
            background-color: #161b22; /* Slightly lighter dark panel */
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.2rem;
            color: #f0f6fc;
            margin-top: 0;
            margin-bottom: 24px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #8b949e; /* Muted gray text */
            margin: 16px 0;
        }
        .highlight {
            color: #58a6ff; /* GitHub Blue accent color */
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Under Construction 🚧</h1>
        <p>Welcome to Rubb's <span class="highlight">GitHub Page</span>!</p>
        <p>I am currently setting up and testing this environment. For now, this page serves as a temporary placeholder while I prepare my full content.</p>
        <p>I will be sharing my projects, skills, and experience here soon.</p>
    </div>
</body>
</html>
